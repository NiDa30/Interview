name: Book QA
on:
  push:
    paths:
      - 'book/**'
      - 'scripts/qa_book.py'
      - 'scripts/qa_release.py'
      - 'scripts/build_book.py'
      - 'scripts/qa_release.py'
      - 'deliverables/**'
      - 'scripts/extract_mermaid.py'
      - 'scripts/test_qa_book.py'
      - '.github/workflows/book-qa.yml'
  pull_request:
    paths:
      - 'book/**'
      - 'scripts/**'
      - '.github/workflows/book-qa.yml'
  workflow_dispatch:

jobs:
  markdown-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile QA scripts
        run: python -m py_compile scripts/qa_book.py scripts/qa_release.py scripts/build_book.py scripts/extract_mermaid.py scripts/test_qa_book.py
      - name: Regression tests for QA rules
        run: python -m unittest discover -s scripts -p 'test_qa_book.py' -v
      - name: Link, fence and basic structure checks
        run: python scripts/qa_book.py
      - name: Consolidated manuscript integrity checks
        run: python scripts/qa_release.py
  mermaid-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare render source
        run: python scripts/extract_mermaid.py /tmp/brse-mermaid
      - name: Install Mermaid CLI
        run: npm install --no-save @mermaid-js/mermaid-cli@11
      - name: Render every diagram or fail
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/brse-svg
          count=0
          passed=0
          failed=0
          : > /tmp/brse-svg/render-results.tsv
          while IFS= read -r -d '' file; do
            name="$(basename "$file" .mmd)"
            count=$((count+1))
            if npx --no-install mmdc -p .github/puppeteer-ci.json -i "$file" -o "/tmp/brse-svg/$name.svg" -q >"/tmp/brse-svg/$name.log" 2>&1; then
              passed=$((passed+1))
              printf 'PASS\\t%s\\n' "$name" >> /tmp/brse-svg/render-results.tsv
            else
              failed=$((failed+1))
              printf 'FAIL\\t%s\\n' "$name" >> /tmp/brse-svg/render-results.tsv
              echo "::error file=$file::Mermaid render failed for $name"
              tail -n 16 "/tmp/brse-svg/$name.log"
            fi
          done < <(find /tmp/brse-mermaid -type f -name '*.mmd' -print0)
          echo "Total=$count Passed=$passed Failed=$failed"
          cat /tmp/brse-svg/render-results.tsv
          test "$count" -gt 0
          test "$failed" -eq 0
      - name: Upload Mermaid render logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mermaid-qa-results
          path: /tmp/brse-svg/
          if-no-files-found: warn
          retention-days: 7
