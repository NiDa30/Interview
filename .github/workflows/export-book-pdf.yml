name: Export Book PDF
on:
  push:
    paths:
      - 'deliverables/BRSE-Interview-Master.md'
      - 'scripts/export_book_pdf.py'
      - '.github/workflows/export-book-pdf.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: book-pdf-main
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Japanese fonts and PDF renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install --disable-pip-version-check markdown weasyprint pypdf
      - name: Prepare illustrated book
        run: python scripts/export_book_pdf.py prepare /tmp/brse-book-pdf
      - name: Install Mermaid diagram renderer
        run: npm install --no-save @mermaid-js/mermaid-cli@11
      - name: Render all 53 manuscript diagrams to PNG
        shell: bash
        run: |
          set -euo pipefail
          count=0
          for file in /tmp/brse-book-pdf/diagrams/*.mmd; do
            npx --no-install mmdc -p .github/puppeteer-ci.json -i "$file" -o "${file%.mmd}.png" -s 2 -q
            count=$((count + 1))
          done
          echo "Rendered PDF figures: $count"
          test "$count" -eq 53
      - name: Export typeset PDF
        run: python scripts/export_book_pdf.py render /tmp/brse-book-pdf
      - name: PDF structure smoke test
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          from pathlib import Path
          p = Path("deliverables/BRSE-Interview-Master.pdf")
          pdf = PdfReader(str(p))
          assert len(pdf.pages) >= 30, f"Unexpected page count: {len(pdf.pages)}"
          first = "".join((page.extract_text() or "") for page in pdf.pages[:3])
          assert "BRSE Interview Master" in first, "Title not found in extracted text"
          print(f"PDF_VALID pages={len(pdf.pages)} bytes={p.stat().st_size}")
          PY
      - name: Upload downloadable PDF
        uses: actions/upload-artifact@v4
        with:
          name: BRSE-Interview-Master-PDF
          path: deliverables/BRSE-Interview-Master.pdf
          if-no-files-found: error
          retention-days: 30
      - name: Commit PDF to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/BRSE-Interview-Master.pdf
          if ! git diff --cached --quiet; then
            git commit -m "release: export BRSE Interview Master illustrated PDF"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
